<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Connexion</title>

<link rel="stylesheet" href="css/login.css">



</head>

<body>

<div class="login-box">

    <h2>Connexion</h2>

    <input
    type="email"
    id="email"
    placeholder="Email">

    <input
    type="password"
    id="password"
    placeholder="Mot de passe">

    <button onclick="login()">

        Se connecter

    </button>

</div>

<script src="js/login.js"></script>

</body>

</html>
