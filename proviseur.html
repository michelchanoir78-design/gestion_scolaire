<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Proviseur</title>

<link rel="stylesheet" href="proviseur.css">
</head>

<body>

<div class="sidebar">

    <div class="profile">
        <img src="images/proviseur.jpg">
        <h2 id="proviseurName"></h2>
        <p>Proviseur</p>
    </div>

    <div class="menu">
        <a href="#">🏠 Accueil</a>
        <a href="#">📊 Statistiques</a>
        <a href="#">📢 Annonces</a>
    </div>

    <button class="logout" onclick="logout()">Déconnexion</button>

</div>

<div class="main">
    <h1>Bienvenue Proviseur 👑</h1>
</div>

<script src="script.js"></script>

<script>
const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "proviseur") {
    window.location.href = "login.html";
}

document.getElementById("proviseurName").innerText =
    user.nom || user.email;
</script>

</body>
</html>
