<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace Élève</title>

<link rel="stylesheet" href="eleve.css">
</head>

<body>

<div class="sidebar">

    <div class="profile">

        <img src="images/student.jpg">

        <h2 id="studentName"></h2>

        <p>Élève</p>

    </div>

    <div class="menu">

        <a href="#">🏠 Accueil</a>
        <a href="#">📚 Mes cours</a>
        <a href="#">📖 Ouvrages</a>
        <a href="#">📝 Notes</a>
        <a href="#">📅 Horaire</a>
        <a href="#">📢 Annonces</a>

    </div>

    <button class="logout" onclick="logout()">
        Déconnexion
    </button>

</div>

<div class="main">

    <div class="top">
        <h1>Bienvenue Élève 👋</h1>
    </div>

    <div class="cards">

        <div class="card">
            <h3>📚 Cours</h3>
            <p>6 cours actifs.</p>
        </div>

        <div class="card">
            <h3>📝 Notes</h3>
            <p>Moyenne : 78%</p>
        </div>

        <div class="card">
            <h3>📢 Annonces</h3>
            <p>2 nouvelles annonces.</p>
        </div>

    </div>

</div>

<!-- SCRIPT -->
<script src="script.js"></script>

<script>
// 🔒 Vérification rôle (compatible avec ton système)
const user = JSON.parse(localStorage.getItem("user"));

if (!user || user.role !== "eleve") {
    window.location.href = "login.html";
}

// 👤 afficher nom
document.getElementById("studentName").innerText =
    user.nom || user.email;
</script>


</body>
</html>
