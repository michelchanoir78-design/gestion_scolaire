<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Espace Étudiant</title>
<link rel="stylesheet" href="css/student.css">


</head>

<body>

<div class="sidebar">

    <div class="profile">

        <img src="images/student.jpg">

        <h2 id="studentName"></h2>

        <p>Étudiant</p>

    </div>

    <div class="menu">

        <a href="#">🏠 Accueil</a>

        <a href="#">📚 Mes cours</a>

        <a href="#">📖 Ouvrages</a>

        <a href="#">📝 Notes</a>

        <a href="#">📅 Horaire</a>

        <a href="#">📢 Annonces</a>

    </div>

    <button class="logout" onclick="logout()">
        Déconnexion
    </button>

</div>

<div class="main">

    <div class="top">

        <h1>Bienvenue Étudiant 👋</h1>

    </div>

    <div class="cards">

        <div class="card">
            <h3>📚 Cours</h3>
            <p>6 cours actifs.</p>
        </div>

        <div class="card">
            <h3>📝 Notes</h3>
            <p>Moyenne : 78%</p>
        </div>

        <div class="card">
            <h3>📢 Annonces</h3>
            <p>2 nouvelles annonces.</p>
        </div>

    </div>

</div>

<script>

const user =
JSON.parse(localStorage.getItem("user"));

if(!user || user.role !== "etudiant"){

    window.location.href = "login.html";
}

document.getElementById("studentName")
.innerText = user.nom;

function logout(){

    localStorage.removeItem("user");

    window.location.href = "login.html";
}

</script>
<script src="js/student.js"></script>

</body>
</html>
