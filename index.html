<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>School Digital System</title>

    <link rel="stylesheet"
    href="style.css">

</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">

            🏫 Excellence School

        </div>

        <nav>

            <a href="#">Accueil</a>

            <a href="#">À propos</a>

            <a href="#">Contact</a>

        </nav>

    </header>

    <!-- HERO -->

    <section class="hero">

        <div class="overlay">

            <h1>
                COMPLEXE SCOLAIRE EXCELLENCE
            </h1>

            <p>
                Bienvenue sur la plateforme scolaire numérique
            </p>

            <div class="buttons">

                <button
                class="login-btn"
                onclick="goLogin()">

                    Se connecter

                </button>

                <button
                class="register-btn"
                onclick="goRegister()">

                    S'inscrire

                </button>

            </div>

        </div>

    </section>

    <script src="script.js"></script>

</body>

</html>
